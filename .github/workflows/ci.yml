name: Selenoid Tests Workflow

on:
  push:
    branches:
      - develop

jobs:
  run-selenoid-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Pull selenoid images
        run: |
          docker pull aerokube/selenoid:1.11.3
          docker pull selenoid/chrome:128.0

      - name: Run tests in docker
        run: |
          docker compose up -d --build selenoid
          echo "Waiting for Selenoid..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4444/status > /dev/null; then
              echo "Selenoid is ready"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:4444/status
          docker compose up --no-deps --build --abort-on-container-exit --exit-code-from test test

      - name: Stop containers
        if: always()
        run: docker compose down
