services:
  selenoid:
    image: aerokube/selenoid:1.11.3
    ports:
      - "4444:4444"
    volumes:
      - "./selenoid_config:/etc/selenoid"
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      DOCKER_API_VERSION: "1.52"
    command: ["-conf", "/etc/selenoid/browser.json", "-container-network", "selenoid"]
    networks:
      - selenoid

  selenoid-ui:
    image: aerokube/selenoid-ui:1.11.3
    ports:
      - "8081:8080"
    command: ["--selenoid-uri", "http://selenoid:4444"]
    depends_on:
      - selenoid
    networks:
      - selenoid

  test:
    build: .
    working_dir: /app
    volumes:
      - ".:/app"
    environment:
      SELENOID_URL: "http://selenoid:4444/wd/hub"
    depends_on:
      - selenoid
    networks:
      - selenoid
    command: ["pytest", "tests/", "-v", "--alluredir=allure-results"]

networks:
  selenoid:
    name: selenoid
